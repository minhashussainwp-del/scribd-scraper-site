<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scribd Downloader — Download Scribd Documents as PDF</title>
<meta name="description" content="Paste a Scribd document URL and download it as a PDF. Free, no signup.">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 16px; }
  .wrap { width: 100%; max-width: 640px; }
  h1 { font-size: 2rem; text-align: center; margin-bottom: 8px; }
  h1 span { color: #38bdf8; }
  p.sub { text-align: center; color: #94a3b8; margin-bottom: 32px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; }
  label { display: block; font-size: .85rem; color: #94a3b8; margin-bottom: 8px; }
  .row { display: flex; gap: 8px; }
  input[type=url] { flex: 1; padding: 12px 14px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; font-size: 1rem; }
  input[type=url]:focus { outline: none; border-color: #38bdf8; }
  button { padding: 12px 20px; border: none; border-radius: 8px; background: #38bdf8; color: #0f172a; font-weight: 700; font-size: 1rem; cursor: pointer; white-space: nowrap; }
  button:hover { background: #7dd3fc; }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin-top: 20px; min-height: 24px; text-align: center; color: #94a3b8; }
  #status .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid #334155; border-top-color: #38bdf8; border-radius: 50%; animation: spin 1s linear infinite; vertical-align: -3px; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: #f87171 !important; }
  .note { margin-top: 12px; font-size: .8rem; color: #64748b; text-align: center; }
  footer { margin-top: 48px; color: #64748b; font-size: .8rem; text-align: center; }
  .steps { display: flex; gap: 12px; margin-top: 32px; }
  .step { flex: 1; background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 16px; text-align: center; font-size: .85rem; color: #94a3b8; }
  .step b { display: block; color: #e2e8f0; font-size: 1.4rem; margin-bottom: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Scribd <span>Downloader</span></h1>
  <p class="sub">Paste a Scribd document link, get a PDF. Free, no signup.</p>

  <div class="card">
    <label for="url">Scribd document URL</label>
    <div class="row">
      <input type="url" id="url" placeholder="https://www.scribd.com/document/123456/..." autocomplete="off">
      <button id="go">Download</button>
    </div>
    <div id="status"></div>
    <p class="note">Large documents can take a minute or two. Keep this tab open.</p>
  </div>

  <div class="steps">
    <div class="step"><b>1</b>Paste the Scribd link</div>
    <div class="step"><b>2</b>We fetch the pages</div>
    <div class="step"><b>3</b>Your PDF downloads</div>
  </div>

  <footer>Only publicly accessible documents can be processed.</footer>
</div>

<script>
  const urlInput = document.getElementById('url');
  const goBtn = document.getElementById('go');
  const statusEl = document.getElementById('status');

  function setStatus(html, isError) {
    statusEl.innerHTML = html;
    statusEl.className = isError ? 'error' : '';
  }

  goBtn.addEventListener('click', async () => {
    const url = urlInput.value.trim();
    if (!url) { setStatus('Please paste a Scribd URL first.', true); return; }
    goBtn.disabled = true;
    setStatus('<span class="spinner"></span>Fetching document, this can take a minute or two for long documents...');
    try {
      const r = await fetch('/api/scrape', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });
      let data = null;
      try { data = await r.json(); } catch (e) {}
      if (r.ok && data && data.downloadUrl) {
        setStatus('Done! Your download should start now. If not, <a href="' + data.downloadUrl + '" target="_blank" rel="noopener" style="color:#38bdf8;">click here</a>.');
        const a = document.createElement('a');
        a.href = data.downloadUrl;
        a.target = '_blank';
        a.rel = 'noopener';
        document.body.appendChild(a);
        a.click();
        a.remove();
      } else {
        const msg = (data && data.error) || 'This document took too long or could not be processed. Please try a shorter document.';
        setStatus(msg, true);
      }
    } catch (e) {
      setStatus('Could not reach the server. Please try again.', true);
    }
    goBtn.disabled = false;
  });

  urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') goBtn.click(); });
</script>
</body>
</html>
